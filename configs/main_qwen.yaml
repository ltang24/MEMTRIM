# RQ1 (Table 1) + mitigation (Tables 2-4) with the open-weight backbone.
# Serve the model with vLLM, e.g.:
#   vllm serve <hf-checkpoint> --port 8000 --served-model-name qwen
run_name: main_qwen
output_dir: results
data_dir: data/processed
datasets: [rippleedits, counterlogic, cladder]
limit: null                 # items per condition; null = all (<=500)
seeds: [0, 1, 2]            # vary memory write order / store composition and LLM seed
encoder: sentence-transformers/all-mpnet-base-v2

llm:                        # answering model
  backend: openai           # OpenAI-compatible endpoint
  model: qwen               # --served-model-name of your vLLM server (set to the checkpoint in the paper)
  base_url: http://localhost:8000/v1
  api_key_env: VLLM_API_KEY
  temperature: 0.0
  max_tokens: 64
  cache_dir: .cache/llm
  extra_body: {chat_template_kwargs: {enable_thinking: false}}   # remove if your model has no thinking mode
parser_llm: null            # MEMTRIM's parser; null = same model with max_tokens 1500
memory_llm: null            # LLM used inside Mem0/A-Mem/Graphiti; null = same as llm

parser:
  n_candidates: 5           # existing keys shown to the equivalence check (App. A.1)
  candidate_sim: 0.6
  max_retries: 1            # one retry with the validation error (App. A.1)

memory:
  backends: [mem0, amem, memgpt, graphiti]
  top_k: 5                  # retrieval budget passed to every method
  pool_k: 15                # candidate pool for MMR
  store_size: 20            # max interactions per memory store
  mem0: {infer: true, encoder: sentence-transformers/all-mpnet-base-v2, embedding_dims: 768, path: .cache/mem0}
  amem: {encoder: all-MiniLM-L6-v2, evo_threshold: 100}
  memgpt: {base_url: "http://localhost:8283", n_core: 1, letta_model: null, letta_embedding: "letta/letta-free"}
  graphiti: {encoder: sentence-transformers/all-mpnet-base-v2, path: .cache/graphiti}   # add uri: bolt://... for Neo4j

methods: [no_memory, memory, facts_only, top1, mmr, sim_filter, recomp, llmlingua2,
          context_faithful, answer_first, micro_act, memtrim]

params:
  answer_max_tokens: 64
  mmr_lambda: 0.5
  sim_threshold: 0.5
  recomp_model: fangyuan/nq_extractive_compressor
  recomp_top_sentences: 3
  llmlingua_model: microsoft/llmlingua-2-xlm-roberta-large-meetingbank
  llmlingua_rate: 0.5
  device: cpu
