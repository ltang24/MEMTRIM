# Offline end-to-end check (no GPU/API). Mock LLM => numbers are meaningless.
run_name: smoke
output_dir: results
data_dir: data/processed_smoke
datasets:
- rippleedits
- counterlogic
- cladder
limit: 6
seeds:
- 0
- 1
encoder: hash
llm:
  backend: mock
  model: mock
  cache_dir: null
  temperature: 0.0
  max_tokens: 64
parser_llm: null
memory_llm: null
parser:
  n_candidates: 5
  candidate_sim: 0.6
  max_retries: 1
memory:
  backends:
  - dense
  top_k: 5
  pool_k: 15
  store_size: 20
  mem0:
    infer: true
    encoder: sentence-transformers/all-mpnet-base-v2
    embedding_dims: 768
    path: .cache/mem0
  amem:
    encoder: all-MiniLM-L6-v2
    evo_threshold: 100
  memgpt:
    base_url: http://localhost:8283
    n_core: 1
    letta_model: null
    letta_embedding: letta/letta-free
  graphiti:
    encoder: sentence-transformers/all-mpnet-base-v2
    path: .cache/graphiti
  dense:
    encoder: hash
methods:
- no_memory
- memory
- facts_only
- top1
- mmr
- sim_filter
- recomp
- context_faithful
- answer_first
- micro_act
- memtrim
- memtrim-keep_shared
- memtrim-keep_conflicts
- memtrim-keep_old_answer
- memtrim-ignore_task_change
- memtrim-embedding_match
params:
  answer_max_tokens: 64
  mmr_lambda: 0.5
  sim_threshold: 0.5
  recomp_model: encoder
  recomp_top_sentences: 3
  llmlingua_model: microsoft/llmlingua-2-xlm-roberta-large-meetingbank
  llmlingua_rate: 0.5
  device: cpu
